[package]
name = "tron-vanity"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "Offline TRON mainnet account vanity address generator"
readme = "README.md"

[dependencies]
argon2 = { version = "0.5", features = ["zeroize"] }
# argon2 0.5.3 wipes its Blake2 state when `zeroize` is on, but it does not
# enable generic-array's `zeroize` feature. The direct feature turns on
# `GenericArray::zeroize` so that wipe compiles.
generic-array = { version = "=0.14.7", features = ["zeroize"] }
base64 = "0.22"
# SHA-256 for the independent checksum only. The search path uses `sha2`.
# `secp256k1` still declares optional `bitcoin_hashes` 0.14, which stays unused.
bitcoin_hashes = { version = "0.16", default-features = false, features = ["std"] }
bs58 = "0.5"
chacha20poly1305 = "0.10"
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
getrandom = "0.2"
k256 = { version = "0.13", default-features = false, features = ["arithmetic", "std"] }
rpassword = "7"
secp256k1 = { version = "0.30", default-features = false, features = ["std", "alloc"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sha3 = "0.10"
thiserror = "2"
tiny-keccak = { version = "2.0", features = ["keccak"] }
zeroize = { version = "1", features = ["alloc"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[lib]
name = "tron_vanity"
path = "src/lib.rs"

[[bin]]
name = "tron-vanity"
path = "src/main.rs"

[[bench]]
name = "derive"
harness = false
